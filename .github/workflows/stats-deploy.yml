# Deploys the page-view counter (worker/, stats.planary.ch) when it changes on main. planary.ch
# itself stays on Vercel. Needs the repository secret CLOUDFLARE_API_TOKEN from the Cloudflare
# account that owns the planary.ch zone, with Workers Scripts, Workers Routes and D1 edit rights.
# Without the secret the job skips instead of failing.
name: Stats deploy

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/stats-deploy.yml']
  workflow_dispatch:

concurrency:
  group: stats-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the stats deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.token.outputs.ok == 'true'
        run: npm ci && npm run typecheck
      - name: Create the database on the first deploy
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 info planary-stats > /dev/null || npx wrangler d1 create planary-stats
      - if: steps.token.outputs.ok == 'true'
        run: npm run db:migrate
      - if: steps.token.outputs.ok == 'true'
        run: npm run deploy
